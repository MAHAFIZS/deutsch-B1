nerseits ... andererseits","en":"on the one hand on the other hand","topic":"Konnektoren & Adverbien"},{"de":"im Gegensatz dazu","en":"in contrast","topic":"Konnektoren & Adverbien"},{"de":"insgesamt","en":"overall","topic":"Konnektoren & Adverbien"},{"de":"hauptsächlich","en":"mainly","topic":"Konnektoren & Adverbien"}],"grammar":[{"group":"Satzbau","name":"Verb an Position 2","rule":"In a statement, the conjugated verb is in the second position (second element, not necessarily second word).","example":"Heute lerne ich Deutsch.","translation":"Today I study German."},{"group":"Satzbau","name":"Ja/Nein-Fragen","rule":"For yes/no questions, place the conjugated verb first.","example":"Hast du heute Zeit?","translation":"Do you have time today?"},{"group":"Satzbau","name":"W-Fragen","rule":"Question word first, conjugated verb second.","example":"Warum lernst du Deutsch?","translation":"Why are you learning German?"},{"group":"Satzbau","name":"Verbklammer","rule":"Modal, future and perfect constructions often create a verb bracket.","example":"Ich muss morgen früh aufstehen.","translation":"I have to get up early tomorrow."},{"group":"Satzbau","name":"Nebensatz","rule":"Subordinating conjunctions send the conjugated verb to the end.","example":"Ich bleibe zu Hause, weil ich krank bin.","translation":"I stay home because I am ill."},{"group":"Satzbau","name":"Nebensatz zuerst","rule":"When the subordinate clause comes first, the main clause starts with the conjugated verb.","example":"Wenn ich Zeit habe, rufe ich dich an.","translation":"If I have time, I will call you."},{"group":"Satzbau","name":"TEKAMOLO","rule":"A useful default ordering for adverbial information: temporal, causal, modal, local. Not a rigid rule.","example":"Ich fahre morgen wegen eines Termins mit dem Zug nach Berlin.","translation":"Tomorrow I travel to Berlin by train because of an appointment."},{"group":"Satzbau","name":"Nicht und kein","rule":"Use kein for negating many nouns without definite articles; use nicht for verbs, adjectives or specified elements.","example":"Ich habe kein Auto, aber ich bin nicht traurig.","translation":"I have no car, but I am not sad."},{"group":"Verben","name":"Trennbare Verben","rule":"In main-clause present tense, the prefix splits and goes to the end; the infinitive stays together.","example":"Ich rufe dich an. / Ich möchte dich anrufen.","translation":"I call you. / I want to call you."},{"group":"Verben","name":"Untrennbare Verben","rule":"Prefixes be-, emp-, ent-, er-, ge-, miss-, ver-, zer- do not separate; no ge- in the participle.","example":"Ich verstehe dich. / Ich habe dich verstanden.","translation":"I understand you. / I understood you."},{"group":"Verben","name":"Reflexive Verben","rule":"Reflexive verbs take mich, dich, sich, uns, euch, sich (sometimes dative).","example":"Ich interessiere mich für Technik.","translation":"I am interested in technology."},{"group":"Verben","name":"Verben mit Präpositionen","rule":"Learn the verb + preposition + required case together.","example":"Ich warte auf den Bus.","translation":"I am waiting for the bus."},{"group":"Verben","name":"Modalverben","rule":"können, müssen, dürfen, sollen, wollen, mögen; modal conjugates, infinitive goes to end.","example":"Du solltest mehr üben.","translation":"You should practice more."},{"group":"Verben","name":"lassen + Infinitiv","rule":"lassen expresses having something done or allowing.","example":"Ich lasse mein Fahrrad reparieren.","translation":"I am having my bike repaired."},{"group":"Verben","name":"Infinitiv mit zu","rule":"Many constructions use zu + infinitive, at the end of a clause.","example":"Ich versuche, pünktlich zu kommen.","translation":"I am trying to arrive on time."},{"group":"Verben","name":"um ... zu / damit","rule":"um ... zu for same subject; damit can express purpose with different subjects.","example":"Ich lerne, um die Prüfung zu bestehen.","translation":"I study in order to pass the exam."},{"group":"Zeiten","name":"Präsens","rule":"Use the present for current habits and even planned futures with a time word.","example":"Morgen arbeite ich nicht.","translation":"I am not working tomorrow."},{"group":"Zeiten","name":"Perfekt","rule":"haben/sein + Partizip II. Motion/change-of-state verbs often take sein.","example":"Ich bin nach Hause gegangen.","translation":"I went home."},{"group":"Zeiten","name":"Präteritum","rule":"Common in writing; sein, haben and modals often used in speech.","example":"Früher hatte ich mehr Freizeit.","translation":"I used to have more free time."},{"group":"Zeiten","name":"Plusquamperfekt","rule":"hatte/war + Partizip II for actions completed before another past event.","example":"Nachdem ich gegessen hatte, ging ich los.","translation":"After I had eaten, I set off."},{"group":"Zeiten","name":"Futur I","rule":"werden + infinitive for predictions, intentions, promises.","example":"Ich werde dich morgen anrufen.","translation":"I will call you tomorrow."},{"group":"Kasus","name":"Nominativ","rule":"The subject of a sentence normally uses nominative.","example":"Der Mann wartet.","translation":"The man is waiting."},{"group":"Kasus","name":"Akkusativ","rule":"Direct objects and certain prepositions use accusative.","example":"Ich kaufe einen Tisch.","translation":"I buy a table."},{"group":"Kasus","name":"Dativ","rule":"Indirect objects and certain prepositions use dative.","example":"Ich helfe dem Nachbarn.","translation":"I help the neighbor."},{"group":"Kasus","name":"Genitiv","rule":"Shows possession and follows certain prepositions.","example":"Das Auto meines Bruders ist alt.","translation":"My brother’s car is old."},{"group":"Kasus","name":"Wechselpräpositionen","rule":"an, auf, hinter, in, neben, über, unter, vor, zwischen: where? dative; direction? accusative.","example":"Das Buch liegt auf dem Tisch. Ich lege es auf den Tisch.","translation":"The book lies on the table. I put it onto the table."},{"group":"Kasus","name":"Dativpräpositionen","rule":"aus, außer, bei, mit, nach, seit, von, zu and gegenüber take dative.","example":"Ich fahre mit dem Bus.","translation":"I travel by bus."},{"group":"Kasus","name":"Akkusativpräpositionen","rule":"durch, für, gegen, ohne, um, bis (and entlang in some constructions) take accusative.","example":"Das Geschenk ist für meinen Vater.","translation":"The gift is for my father."},{"group":"Kasus","name":"Artikel und Plural","rule":"Learn nouns with article and plural. Article case forms change in context.","example":"der Termin – die Termine; den Termin; dem Termin","translation":"appointment – appointments"},{"group":"Kasus","name":"Personalpronomen","rule":"Pronouns change by case: ich/mich/mir; du/dich/dir; er/ihn/ihm.","example":"Kannst du mir helfen?","translation":"Can you help me?"},{"group":"Kasus","name":"Possessivartikel","rule":"mein, dein, sein, ihr, unser, euer, Ihr take case endings.","example":"Ich besuche meine Eltern.","translation":"I visit my parents."},{"group":"Adjektive","name":"Adjektivdeklination","rule":"Adjective endings depend on article, gender, case, number.","example":"Ich kaufe einen neuen Computer.","translation":"I buy a new computer."},{"group":"Adjektive","name":"Komparativ und Superlativ","rule":"Comparative usually -er; superlative often am ...-sten; irregular forms exist.","example":"Deutsch ist leichter als gedacht.","translation":"German is easier than expected."},{"group":"Adjektive","name":"Vergleich mit als / wie","rule":"Use als for differences and wie for equal comparisons.","example":"Mein Weg ist länger als deiner.","translation":"My route is longer than yours."},{"group":"Nebensätze","name":"weil / denn / deshalb","rule":"weil sends verb to end, denn retains main-clause order; deshalb triggers inversion.","example":"Ich bin müde. Deshalb gehe ich früh schlafen.","translation":"I am tired. Therefore I go to bed early."},{"group":"Nebensätze","name":"dass / ob","rule":"dass means that; ob introduces indirect yes/no questions. Both are subordinate.","example":"Ich weiß nicht, ob er kommt.","translation":"I do not know whether he is coming."},{"group":"Nebensätze","name":"wenn / als","rule":"wenn for conditions and recurring time; als for a one-time past event.","example":"Als ich klein war, wohnte ich in Dhaka.","translation":"When I was little, I lived in Dhaka."},{"group":"Nebensätze","name":"obwohl / trotzdem","rule":"obwohl subordinates, trotzdem begins a main clause and takes position 1.","example":"Obwohl es regnet, gehe ich spazieren.","translation":"Although it is raining, I go for a walk."},{"group":"Nebensätze","name":"bevor / nachdem / während","rule":"Time conjunctions send the verb to the end. Pay attention to event ordering.","example":"Bevor ich gehe, rufe ich dich an.","translation":"Before I leave, I call you."},{"group":"Nebensätze","name":"Relativsätze","rule":"Relative pronouns match noun gender/number; case depends on their role in the relative clause.","example":"Das ist der Mann, der hier arbeitet.","translation":"That is the man who works here."},{"group":"Nebensätze","name":"Indirekte Fragen","rule":"After question words, the embedded conjugated verb goes to the end.","example":"Weißt du, wann der Zug abfährt?","translation":"Do you know when the train leaves?"},{"group":"Zusatz","name":"Konjunktiv II – Wünsche","rule":"Use hätte, wäre, könnte or würde + infinitive for unreal wishes, polite requests.","example":"Ich hätte gern einen Termin.","translation":"I would like an appointment."},{"group":"Zusatz","name":"Konjunktiv II – Bedingungen","rule":"Express unreal conditions with wenn + Konjunktiv II.","example":"Wenn ich mehr Zeit hätte, würde ich mehr lesen.","translation":"If I had more time, I would read more."},{"group":"Zusatz","name":"Passiv Präsens","rule":"werden + Partizip II describes what is done to something.","example":"Das Formular wird geprüft.","translation":"The form is being checked."},{"group":"Zusatz","name":"Passiv Präteritum","rule":"wurde + Partizip II expresses past passive events.","example":"Die Straße wurde gesperrt.","translation":"The road was closed."},{"group":"Zusatz","name":"Indefinitpronomen","rule":"jemand, niemand, etwas, nichts, alle, einige, viele refer to unspecified people/things.","example":"Niemand hat die Frage beantwortet.","translation":"Nobody answered the question."},{"group":"Zusatz","name":"Pronominaladverbien","rule":"da(r)+preposition refers to things; wo(r)+preposition asks about things.","example":"Worauf wartest du? Darauf warte ich.","translation":"What are you waiting for? I am waiting for that."},{"group":"Zusatz","name":"Zweiteilige Konnektoren","rule":"sowohl ... als auch; entweder ... oder; weder ... noch; nicht nur ... sondern auch.","example":"Ich spreche sowohl Deutsch als auch Englisch.","translation":"I speak both German and English."},{"group":"Zusatz","name":"N-Deklination","rule":"Some masculine nouns add -(e)n in non-nominative singular forms.","example":"Ich helfe dem Kollegen.","translation":"I help the colleague."},{"group":"Zusatz","name":"Partizip als Adjektiv","rule":"Present and past participles can function as adjectives.","example":"Das ist eine interessante Frage.","translation":"That is an interesting question."},{"group":"Zusatz","name":"Redemittel für Meinungen","rule":"Use opinion formulas to structure speaking and writing.","example":"Meiner Meinung nach ist Bildung sehr wichtig.","translation":"In my opinion education is very important."},{"group":"Zusatz","name":"Beschwerde und formelle E-Mail","rule":"Formal writing needs greeting, reason, request and closing.","example":"Ich möchte mich über die Lieferung beschweren.","translation":"I would like to complain about the delivery."}],"quiz":[{"tag":"weil","q":"Ich bleibe zu Hause, weil ich krank ___.","options":["bin","ist","sein"],"correct":0,"why":"weil puts the conjugated verb at the end."},{"tag":"separable","q":"Ich ___ meine Mutter heute ___.","options":["rufe / an","anrufe / –","rufe / ein"],"correct":0,"why":"anrufen separates in a main clause."},{"tag":"modal","q":"Ich muss morgen früh ___.","options":["aufstehen","stehe auf","aufgestanden"],"correct":0,"why":"After müssen, use the complete infinitive."},{"tag":"perfect","q":"Gestern ___ ich nach Berlin gefahren.","options":["bin","habe","werde"],"correct":0,"why":"fahren with motion typically takes sein in Perfekt."},{"tag":"cases","q":"Ich helfe ___ Mann.","options":["dem","den","der"],"correct":0,"why":"helfen requires dative."},{"tag":"cases","q":"Ich kaufe ___ neuen Tisch.","options":["einen","ein","einem"],"correct":0,"why":"kaufen takes an accusative object."},{"tag":"connectors","q":"Ich bin müde. Deshalb ___ ich schlafen.","options":["gehe","ich gehe","gehen"],"correct":0,"why":"Deshalb first, conjugated verb second."},{"tag":"time","q":"___ ich ein Kind war, lebte ich in Dhaka.","options":["Als","Wenn","Ob"],"correct":0,"why":"als refers to a one-time period/event in the past."},{"tag":"purpose","q":"Ich lerne, ___ die Prüfung zu bestehen.","options":["um","damit","weil"],"correct":0,"why":"um ... zu expresses purpose with the same subject."},{"tag":"relative","q":"Das ist die Frau, ___ nebenan wohnt.","options":["die","der","den"],"correct":0,"why":"The relative pronoun is nominative feminine."},{"tag":"konjunktiv","q":"Wenn ich mehr Zeit ___, würde ich reisen.","options":["hätte","habe","hatte"],"correct":0,"why":"Unreal present condition uses Konjunktiv II."},{"tag":"preposition","q":"Ich warte ___ den Bus.","options":["auf","für","mit"],"correct":0,"why":"warten auf + Akkusativ."},{"tag":"reflexive","q":"Ich interessiere ___ für Musik.","options":["mich","mir","dich"],"correct":0,"why":"sich interessieren für + accusative reflexive pronoun."},{"tag":"adjective","q":"Ich habe einen ___ Laptop gekauft.","options":["neuen","neue","neues"],"correct":0,"why":"Accusative masculine after einen takes -en."},{"tag":"passive","q":"Die Rechnung ___ heute bezahlt.","options":["wird","hat","ist"],"correct":0,"why":"Present passive: werden + Partizip II."},{"tag":"indirect","q":"Weißt du, wann der Kurs ___?","options":["beginnt","beginnen","beginnt er"],"correct":0,"why":"Indirect question: finite verb at the end."},{"tag":"perfect","q":"Ich habe den Antrag ___.","options":["ausgefüllt","geausfüllt","ausfüllen"],"correct":0,"why":"Separable participle: aus + ge + füllt."},{"tag":"nonseparable","q":"Ich habe den Brief ___.","options":["verstanden","geverstanden","verstehen"],"correct":0,"why":"ver- verbs do not take ge-."},{"tag":"two-part","q":"Sie spricht ___ Deutsch ___ Englisch.","options":["sowohl / als auch","entweder / noch","weder / oder"],"correct":0,"why":"sowohl ... als auch = both ... and."},{"tag":"perfect","q":"Ich ___ gestern viel gearbeitet.","options":["habe","bin","werde"],"correct":0,"why":"arbeiten usually uses haben in Perfekt."}],"writing":[["Formelle E-Mail","Write to a language school asking about B1 course dates, fees and registration."],["Beschwerde","Complain about a damaged delivery and request a replacement."],["Termin verschieben","Ask politely to reschedule an appointment and suggest two alternatives."],["Meinung äußern","Should people work from home? Give advantages, disadvantages and your view."],["Erlebnis berichten","Describe an unexpected experience during a journey."],["Einladung","Invite a friend to a celebration, giving time, place and activities."]],"speaking":[["Sich vorstellen","Introduce yourself: residence, studies, work, hobbies, plans."],["Etwas gemeinsam planen","Plan a weekend trip with a partner: date, transport, budget and activities."],["Ein Thema präsentieren","Give a 2-minute opinion on online learning: experience, advantages, disadvantages."],["Bild beschreiben","Describe a room, people and actions; make careful guesses."],["Reagieren","Politely agree, disagree, ask for clarification and propose alternatives."]]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(k,def)=>{try{return JSON.parse(localStorage.getItem('dk2_'+k))??def}catch{return def}};
const save=(k,x)=>{try{localStorage.setItem('dk2_'+k,JSON.stringify(x))}catch{}};
let known=store('known',{}),done=store('done',{}),scores=store('scores',[]),drafts=store('drafts',{}),view='home',topic='All',term='',cardNo=0,flipped=false,quizNo=0,selected=-1,graded=false;
const topics=[...new Set(DATA.words.map(w=>w.topic))],groups=[...new Set(DATA.grammar.map(g=>g.group))];
const say=t=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.86;speechSynthesis.speak(u)}};
const action=(s,label,kind='')=>`<button class="${kind}" onclick="${s}">${label}</button>`;
function go(v){view=v;topic='All';term='';quizNo=0;selected=-1;graded=false;render();window.scrollTo(0,0)}
function render(){let names=[['home','🏠 Dashboard'],['vocab','📚 Vocabulary'],['cards','🃏 Flashcards'],['grammar','📐 Grammar'],['quiz','✅ Quiz'],['write','✍️ Writing'],['speak','🎤 Speaking']];$('#tabs').innerHTML=names.map(([id,t])=>`<button class="${view===id?'selected':''}" onclick="go('${id}')">${t}</button>`).join('');$('#counts').textContent=`${DATA.words.length} vocabulary entries · ${DATA.grammar.length} rules`;let app=$('#app');({home:home,vocab:vocab,cards:cards,grammar:grammar,quiz:quiz,write:write,speak:speak})[view](app)}
function home(a){let n=Object.values(known).filter(Boolean).length,gd=Object.values(done).filter(Boolean).length;a.innerHTML=`<div class="card"><h1>Dein B1-Lernraum 👋</h1><p>Work through the vocabulary by topic and grammar by rule. Use audio, flashcards, practice questions and exam prompts. Everything runs on your iPhone in Safari.</p><div class="grid"><div><div class="metric">${DATA.words.length}</div>Vocabulary entries</div><div><div class="metric">${n}</div>Words marked known</div><div><div class="metric">${gd}/${DATA.grammar.length}</div>Grammar rules done</div><div><div class="metric">${scores.length}</div>Completed quizzes</div></div><br><p class="muted">Learning progress</p><progress max="${DATA.words.length}" value="${n}"></progress></div><div class="grid"><div class="card"><h3>📚 Vocabulary</h3><p>Learn by topic, filter words, listen and mark as known.</p>${action("go('vocab')",'Study words','primary')}</div><div class="card"><h3>📐 Grammar</h3><p>Includes separable verbs, reflexive verbs, cases, tenses, subordinate clauses, passive and Konjunktiv II.</p>${action("go('grammar')",'Open grammar','primary')}</div><div class="card"><h3>🧠 Daily practice</h3><p>Recall a word, listen, construct a sentence and answer quiz questions.</p>${action("go('quiz')",'Start quiz','primary')}</div></div><div class="card"><h3>Daily study routine</h3><p>① 15–20 new words → ② 1 grammar rule → ③ 10 flashcards → ④ quiz → ⑤ write or speak 5–10 sentences.</p><p class="muted">A CEFR level has no single exhaustive official word list; this is an expanding, curated B1-oriented vocabulary bank rather than a promise that every exam word is included.</p></div>`}
function picker(options,current,fn){return `<select class="field" onchange="${fn}(this.value)">${options.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function setTopic(t){topic=t;cardNo=0;flipped=false;render()}
function setTerm(t){term=t;render();let el=$('#search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function matches(){return DATA.words.filter(w=>(topic==='All'||w.topic===topic)&&(`${w.de} ${w.en}`.toLowerCase().includes(term.toLowerCase())))}
function vocab(a){let list=matches();a.innerHTML=`<div class="card"><h2>Vocabulary bank</h2><p class="muted">Learn articles with nouns. Each word includes its English meaning and German text-to-speech; some plurals/verb patterns require dictionary lookup.</p>${picker(['All',...topics],topic,'setTopic')}<input id="search" class="field" value="${esc(term)}" placeholder="Search German or English" oninput="setTerm(this.value)"><div class="count">${list.length} entries · ${list.filter(w=>known[w.de]).length} known</div><div id="words"></div></div>`;$('#words').innerHTML=list.slice(0,250).map(w=>`<div class="word"><div class="grow"><b>${esc(w.de)}</b> <small>— ${esc(w.en)}</small><br><small>${esc(w.topic)}</small></div>${action(`say(${JSON.stringify(w.de).replace(/"/g,'&quot;')})`,'🔊')}${action(`toggleWord(${JSON.stringify(w.de).replace(/"/g,'&quot;')})`,known[w.de]?'✓ Known':'+ Learn',known[w.de]?'primary':'')}</div>`).join('')+(list.length>250?'<p class="muted">Showing first 250 matches. Narrow your search or choose a topic.</p>':'')}
function toggleWord(w){known[w]=!known[w];save('known',known);render()}
function cards(a){let list=matches();if(!list.length){a.innerHTML='<div class="card">No matching words.</div>';return}cardNo=Math.min(cardNo,list.length-1);let w=list[cardNo];a.innerHTML=`<div class="card"><h2>Flashcard review</h2>${picker(['All',...topics],topic,'setTopic')}<div class="count">${cardNo+1} / ${list.length}</div><div class="card" style="text-align:center;min-height:230px;display:grid;place-content:center"><div class="big">${esc(w.de)}</div><p>${flipped?esc(w.en):'Think of the English meaning'}</p>${action('flipped=!flipped;render()','Flip card','primary')} ${action(`say(${JSON.stringify(w.de).replace(/"/g,'&quot;')})`,'🔊 Listen')}</div><div class="row">${action('cardNo=Math.max(0,cardNo-1);flipped=false;render()','← Previous')}${action('toggleWord('+JSON.stringify(w.de).replace(/"/g,'&quot;')+')',known[w.de]?'✓ Known':'Mark known')}${action('cardNo=(cardNo+1)%matches().length;flipped=false;render()','Next →','primary')}</div></div>`}
function grammar(a){let list=DATA.grammar.filter(g=>(topic==='All'||g.group===topic)&&(`${g.name} ${g.rule}`.toLowerCase().includes(term.toLowerCase())));a.innerHTML=`<div class="card"><h2>Grammar A2–B1</h2><p class="muted">English explanations, German examples, and lesson completion tracking.</p>${picker(['All',...groups],topic,'setTopic')}<input id="search" class="field" value="${esc(term)}" placeholder="Search grammar topics" oninput="setTerm(this.value)"></div>`+list.map((g)=>`<div class="card"><div class="row"><span class="tag">${esc(g.group)}</span><span class="grow"></span>${action(`markRule(${DATA.grammar.indexOf(g)})`,done[g.name]?'✓ Learned':'Mark learned',done[g.name]?'primary':'')}</div><h3>${esc(g.name)}</h3><p>${esc(g.rule)}</p><div class="answer"><strong>${esc(g.example)}</strong><br><small>${esc(g.translation)}</small></div>${action(`say(${JSON.stringify(g.example).replace(/"/g,'&quot;')})`,'🔊 Hear example')}</div>`).join('')}
function markRule(i){let k=DATA.grammar[i].name;done[k]=!done[k];save('done',done);render()}
function quiz(a){let q=DATA.quiz[quizNo];a.innerHTML=`<div class="card"><h2>B1 grammar quiz</h2><p class="muted">Question ${quizNo+1} / ${DATA.quiz.length}</p><progress max="${DATA.quiz.length}" value="${quizNo+1}"></progress><h3>${esc(q.q)}</h3>${q.options.map((o,i)=>`<p><button class="${selected===i?'selected':''}" style="width:100%;text-align:left" onclick="selected=${i};graded=false;render()">${String.fromCharCode(65+i)}. ${esc(o)}</button></p>`).join('')}${graded?`<div class="answer"><b class="${selected===q.correct?'correct':'wrong'}">${selected===q.correct?'Correct!':'Not quite. Correct: '+esc(q.options[q.correct])}</b><p>${esc(q.why)}</p></div>`:''}<div class="row">${action('gradeQuiz()','Check answer','primary')}${graded?action('nextQuiz()','Next question →'):''}</div></div>`}
function gradeQuiz(){if(selected<0)return;graded=true;render()}
function nextQuiz(){let q=DATA.quiz[quizNo];scores.push({correct:selected===q.correct,at:Date.now()});save('scores',scores);quizNo=(quizNo+1)%DATA.quiz.length;selected=-1;graded=false;render()}
function write(a){a.innerHTML=`<div class="card"><h2>B1 writing workshop</h2><p class="muted">Practice opening, reason, 2–3 supporting points, request/opinion, closing. Drafts save only in your browser.</p></div>`+DATA.writing.map(([name,p],i)=>`<div class="card"><h3>${esc(name)}</h3><p>${esc(p)}</p><textarea class="field" id="draft${i}" placeholder="Schreibe hier auf Deutsch ..." oninput="drafts[${i}]=this.value;save('drafts',drafts)">${esc(drafts[i]||'')}</textarea><small>Useful phrases: Sehr geehrte Damen und Herren, ... / Ich möchte ... / Könnten Sie bitte ...? / Mit freundlichen Grüßen</small></div>`).join('')}
function speak(a){a.innerHTML=`<div class="card"><h2>B1 speaking workshop</h2><p>Speak for 1–2 minutes and record yourself using your iPhone's Voice Memos app if you want to review pronunciation. Speaking answers are not automatically evaluated.</p><p class="muted">Redemittel: Meiner Meinung nach ... · Einerseits ... andererseits ... · Ich schlage vor, dass ... · Wie wäre es, wenn ...?</p></div>`+DATA.speaking.map(([name,p])=>`<div class="card"><h3>${esc(name)}</h3><p>${esc(p)}</p>${action(`say(${JSON.stringify(name).replace(/"/g,'&quot;')})`,'🔊 Listen to topic')}</div>`).join('')}
render();
</script></body></html>
