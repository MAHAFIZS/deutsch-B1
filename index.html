<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeutschKompass — German A2–B1</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf8;background:#0a1020}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}#app{min-height:100vh}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#0e172c;padding:25px 16px;border-right:1px solid #253450;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}.brand{font-size:23px;font-weight:900;letter-spacing:-.8px;padding:0 13px}.brand span{color:#72dcbd}.muted{color:#93a1be}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#abb9d0;text-align:left;border:0;border-radius:12px;padding:12px 14px}.nav button.active,.nav button:hover{background:#263654;color:white}.sidebottom{margin-top:auto;font-size:12px;padding:12px;color:#a8b8cf;border:1px solid #283653;border-radius:12px}.main{padding:28px 36px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#76ddc1;font-size:11px;font-weight:800}h1{font-size:clamp(28px,4vw,44px);margin:8px 0 12px;letter-spacing:-1.4px}h2{margin:0 0 14px;letter-spacing:-.5px}h3{margin:0 0 10px}.lead{font-size:16px;color:#acbbd2;line-height:1.7}.hero{background:linear-gradient(115deg,#20405c,#183f4c 60%,#174f50);padding:30px;border:1px solid #2d6771;border-radius:22px;margin:25px 0}.hero h1{margin-top:0}.btn{border:0;background:#65ddbd;color:#092427;padding:11px 16px;font-weight:800;border-radius:10px}.btn.secondary{background:#243651;color:#edf3ff}.btn.ghost{background:transparent;border:1px solid #3b5273;color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#141e34;border:1px solid #283753;padding:20px;border-radius:17px}.card p{color:#aebbd0;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#141e34;border:1px solid #2d3c56;padding:16px;border-radius:13px}.stat strong{display:block;font-size:25px;margin:6px 0}.pill{display:inline-block;background:#254439;color:#80e4c3;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:800}.tag{font-size:12px;color:#b7cbe7;border:1px solid #3a4d6a;padding:4px 8px;border-radius:40px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.progress{background:#29364e;height:9px;border-radius:30px;overflow:hidden}.progress>div{background:#65ddbd;height:100%;border-radius:30px;transition:width .3s}.section{margin:30px 0}.lesson-card{cursor:pointer;transition:.2s}.lesson-card:hover{transform:translateY(-2px);border-color:#65ddbd}.lesson-card .number{color:#65ddbd;font-size:12px;letter-spacing:.12em;font-weight:900}.lesson-body{line-height:1.8;color:#d2dded}.example{margin:12px 0;background:#0f2a34;border-left:3px solid #65ddbd;border-radius:8px;padding:12px 16px}.example b{color:#7ce4c3}.example small{display:block;color:#afc6d5}.word-table{width:100%;border-collapse:collapse}.word-table td,.word-table th{padding:12px;text-align:left;border-bottom:1px solid #2b3b54}.word-table th{color:#7be0c1}.flash{margin:20px auto;max-width:600px;min-height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(140deg,#19354b,#1b2943);border:1px solid #4a637c;border-radius:20px;padding:25px;cursor:pointer}.flash strong{font-size:clamp(24px,4vw,35px)}.flash p{margin:8px;color:#bcd0e0}.options{display:grid;gap:9px;margin:17px 0}.option{background:#1b2b43;color:white;border:1px solid #364965;text-align:left;padding:13px;border-radius:10px}.option.selected{border-color:#65ddbd;background:#224c4d}.option.good{border-color:#65ddbd;background:#163e33}.option.bad{border-color:#ff8495;background:#4a2936}.field{width:100%;border:1px solid #3a4d6a;color:white;background:#0c172b;border-radius:10px;padding:12px}.field:focus{outline:2px solid #65ddbd}.writearea{width:100%;min-height:140px;resize:vertical}.speak{font-size:17px;background:#142c3e;border-radius:12px;padding:18px;border:1px solid #326070}.footer{margin-top:45px;font-size:12px;color:#7f90af}.mobilehead{display:none}.pillbtn{background:#26394f;border:1px solid #39536e;color:white;padding:9px 12px;border-radius:9px}.pillbtn.active{background:#2c655a;border-color:#65ddbd}.empty{padding:25px;text-align:center;color:#aab6c9}.hidden{display:none!important}@media(max-width:900px){.shell{display:block}.sidebar{position:static;height:auto;display:block;padding:15px}.brand{padding:5px}.nav{display:flex;overflow-x:auto;gap:5px;margin-top:12px}.nav button{white-space:nowrap}.sidebottom{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid,.grid.two{grid-template-columns:1fr}.top{align-items:flex-start}.hero{padding:20px}.word-table td,.word-table th{font-size:13px;padding:8px}}

const units=[
{id:'separable',title:'Trennbare Verben',level:'A2–B1',topic:'Verbs',description:'Learn how German prefixes separate, and when they stay attached.',rules:[['Present tense','Ich <b>stehe</b> um 7 Uhr <b>auf</b>.','I get up at 7.'],['Modal verb','Ich muss früh <b>aufstehen</b>.','I have to get up early.'],['Perfekt','Ich bin heute früh <b>aufgestanden</b>.','I got up early today.'],['Subordinate clause','Ich bin müde, weil ich früh <b>aufstehe</b>.','I am tired because I get up early.']],tip:'In main clauses, the conjugated verb takes position 2 and the separable prefix moves to the end. In subordinate clauses, the conjugated verb (with prefix) goes to the end.'},
{id:'inseparable',title:'Untrennbare Verben',level:'A2–B1',topic:'Verbs',description:'Recognize be-, emp-, ent-, er-, ge-, miss-, ver-, zer-.',rules:[['Present','Ich <b>besuche</b> meinen Freund.','I visit my friend.'],['Perfekt','Ich habe meinen Freund <b>besucht</b>.','I visited my friend.'],['Difference','Ich habe das Wort <b>verstanden</b>.','I understood the word.']],tip:'Common inseparable prefixes do not split. The past participle generally does not add ge-: besuchen → besucht.'},
{id:'wordorder',title:'Satzbau & Word Order',level:'B1',topic:'Grammar',description:'Main clause, inversion, time–manner–place and verb-second.',rules:[['Normal','<b>Ich lerne</b> jeden Tag Deutsch.','I study German every day.'],['Time first','<b>Heute lerne</b> ich Deutsch.','Today I study German.'],['Time–manner–place','Ich fahre <b>morgen mit dem Bus nach Berlin</b>.','I travel to Berlin by bus tomorrow.']],tip:'The conjugated verb stays second in statements. When time moves first, the subject follows the verb.'},
{id:'connectors',title:'Weil, Dass, Wenn, Obwohl',level:'B1',topic:'Grammar',description:'Use subordinate clauses confidently.',rules:[['weil','Ich lerne, weil ich eine Prüfung <b>habe</b>.','I study because I have an exam.'],['dass','Ich denke, dass Deutsch wichtig <b>ist</b>.','I think German is important.'],['wenn','Wenn ich Zeit <b>habe</b>, lese ich.','When I have time, I read.'],['obwohl','Obwohl es <b>regnet</b>, gehe ich raus.','Although it rains, I go out.']],tip:'Weil, dass, wenn and obwohl push the conjugated verb to the end of their clause. Deshalb and trotzdem do not.'},
{id:'perfect',title:'Perfekt & Präteritum',level:'A2–B1',topic:'Verbs',description:'Talk about past experiences with haben and sein.',rules:[['haben','Ich <b>habe</b> gestern <b>gearbeitet</b>.','I worked yesterday.'],['sein','Ich <b>bin</b> nach Hause <b>gefahren</b>.','I went home.'],['Präteritum','Früher <b>war</b> ich Student.','I used to be a student.']],tip:'Use sein often with movement or changes of state. Spoken German favors Perfekt; war, hatte and modal past forms are also common.'},
{id:'cases',title:'Akkusativ & Dativ',level:'A2–B1',topic:'Grammar',description:'Practice articles, pronouns and two-way prepositions.',rules:[['Accusative','Ich sehe <b>den</b> Mann.','I see the man.'],['Dative','Ich helfe <b>dem</b> Mann.','I help the man.'],['Direction','Ich gehe <b>in die</b> Küche.','I go into the kitchen.'],['Location','Ich bin <b>in der</b> Küche.','I am in the kitchen.']],tip:'Accusative often answers wohin? (movement to a place), dative often answers wo? (location) with two-way prepositions.'},
{id:'reflexive',title:'Reflexive Verben',level:'B1',topic:'Verbs',description:'sich freuen, sich erinnern, sich interessieren.',rules:[['sich freuen','Ich <b>freue mich auf</b> den Urlaub.','I look forward to the holiday.'],['sich interessieren','Ich <b>interessiere mich für</b> Technik.','I am interested in technology.'],['sich erinnern','Ich <b>erinnere mich an</b> den Termin.','I remember the appointment.']],tip:'Learn reflexive verbs together with their preposition and the required case.'},
{id:'relative',title:'Relativsätze',level:'B1',topic:'Grammar',description:'Link ideas using der, die, das, den, dem.',rules:[['Nominative','Das ist der Mann, <b>der</b> hier arbeitet.','That is the man who works here.'],['Accusative','Das ist der Mann, <b>den</b> ich kenne.','That is the man whom I know.'],['Dative','Das ist die Frau, <b>der</b> ich helfe.','That is the woman whom I help.']],tip:'The relative pronoun matches the noun’s gender and number, but its case depends on its function in the relative clause.'},
{id:'konjunktiv',title:'Konjunktiv II',level:'B1',topic:'Grammar',description:'Polite requests, wishes and hypothetical situations.',rules:[['Polite','<b>Könnten</b> Sie mir bitte helfen?','Could you please help me?'],['Wish','Ich <b>hätte</b> gern mehr Zeit.','I would like more time.'],['Hypothetical','Wenn ich mehr Geld <b>hätte</b>, <b>würde</b> ich reisen.','If I had more money, I would travel.']],tip:'For many verbs, würde + infinitive is a useful hypothetical pattern. Common forms include hätte, wäre, könnte, müsste.'},
{id:'infinitive',title:'Infinitiv mit zu',level:'B1',topic:'Grammar',description:'Practice useful infinitive constructions.',rules:[['Simple','Ich versuche, Deutsch <b>zu lernen</b>.','I try to learn German.'],['Separable','Ich habe vor, früh <b>aufzustehen</b>.','I intend to get up early.'],['Purpose','Ich lerne, <b>um</b> die Prüfung <b>zu bestehen</b>.','I study to pass the exam.']],tip:'With separable verbs, zu goes between prefix and stem: auf + zu + stehen → aufzustehen.'},
{id:'adjectives',title:'Adjective Endings',level:'B1',topic:'Grammar',description:'Use adjectives correctly with articles and cases.',rules:[['Nominative','Das ist <b>ein guter</b> Job.','That is a good job.'],['Accusative','Ich suche <b>einen guten</b> Job.','I am looking for a good job.'],['Dative','Ich arbeite mit <b>einem netten</b> Kollegen.','I work with a nice colleague.']],tip:'Adjective endings change depending on gender, number, case and the accompanying article.'},
{id:'passive',title:'Passiv with werden',level:'B1',topic:'Grammar',description:'Describe processes and actions rather than the actor.',rules:[['Present','Das Formular <b>wird ausgefüllt</b>.','The form is being filled in.'],['Past','Das Formular <b>wurde ausgefüllt</b>.','The form was filled in.']],tip:'Passive is formed with werden + past participle. The participle normally stays at the end.'}
];
const vocab=[
['der Termin','appointment','die Termine','Ich habe morgen einen Termin.','Appointments'],['die Bewerbung','application','die Bewerbungen','Ich schicke heute meine Bewerbung.','Work'],['der Vertrag','contract','die Verträge','Ich unterschreibe den Vertrag.','Work'],['die Erfahrung','experience','die Erfahrungen','Ich habe Erfahrung mit Robotik.','Work'],['die Voraussetzung','requirement','die Voraussetzungen','Deutsch ist eine wichtige Voraussetzung.','Work'],['die Entscheidung','decision','die Entscheidungen','Das ist eine schwere Entscheidung.','Daily life'],['die Möglichkeit','possibility','die Möglichkeiten','Es gibt viele Möglichkeiten.','Daily life'],['die Rechnung','bill / invoice','die Rechnungen','Können Sie mir die Rechnung schicken?','Daily life'],['der Antrag','application / request','die Anträge','Ich fülle den Antrag aus.','Appointments'],['die Behörde','authority / government office','die Behörden','Ich habe einen Termin bei der Behörde.','Appointments'],['vereinbaren','to arrange','—','Ich möchte einen Termin vereinbaren.','Appointments'],['verschieben','to postpone','—','Wir müssen den Termin verschieben.','Appointments'],['absagen','to cancel','—','Ich sage den Termin ab.','Appointments'],['ausfüllen','to fill in','—','Bitte füllen Sie das Formular aus.','Appointments'],['mitbringen','to bring along','—','Bringen Sie Ihren Ausweis mit.','Appointments'],['die Bewerbungsgespräch','job interview (incorrect article—see correction)','—','—','Work'],['das Vorstellungsgespräch','job interview','die Vorstellungsgespräche','Ich bereite mich auf das Vorstellungsgespräch vor.','Work'],['die Stelle','position / job','die Stellen','Ich bewerbe mich auf die Stelle.','Work'],['die Aufgabe','task','die Aufgaben','Diese Aufgabe ist schwierig.','Work'],['das Gehalt','salary','die Gehälter','Das Gehalt wird monatlich gezahlt.','Work'],['die Versicherung','insurance','die Versicherungen','Ich habe eine Krankenversicherung.','Daily life'],['die Miete','rent','die Mieten','Die Miete ist hoch.','Housing'],['der Umzug','move / relocation','die Umzüge','Unser Umzug war anstrengend.','Housing'],['die Wohnung','apartment','die Wohnungen','Unsere Wohnung ist hell.','Housing'],['der Vermieter','landlord','die Vermieter','Ich rufe den Vermieter an.','Housing'],['die Gesundheit','health','—','Gesundheit ist sehr wichtig.','Health'],['die Untersuchung','examination / checkup','die Untersuchungen','Morgen habe ich eine Untersuchung.','Health'],['das Rezept','prescription / recipe','die Rezepte','Der Arzt schreibt ein Rezept.','Health'],['die Beschwerde','complaint','die Beschwerden','Ich möchte eine Beschwerde einreichen.','Daily life'],['die Lieferung','delivery','die Lieferungen','Wann kommt die Lieferung an?','Shopping'],['die Verspätung','delay','die Verspätungen','Der Zug hat Verspätung.','Travel'],['die Verbindung','connection','die Verbindungen','Diese Zugverbindung ist schnell.','Travel'],['umsteigen','to change trains','—','Ich muss in Nürnberg umsteigen.','Travel'],['teilnehmen','to participate','—','Ich nehme an einem Kurs teil.','Education'],['bestehen','to pass (an exam)','—','Ich möchte die B1-Prüfung bestehen.','Education'],['verbessern','to improve','—','Ich möchte meine Aussprache verbessern.','Education'],['die Meinung','opinion','die Meinungen','Meiner Meinung nach ist das sinnvoll.','Education'],['der Vorteil','advantage','die Vorteile','Ein Vorteil ist die Flexibilität.','Education'],['der Nachteil','disadvantage','die Nachteile','Es gibt auch einen Nachteil.','Education'],['zuverlässig','reliable','—','Meine Kollegin ist sehr zuverlässig.','Work'],['pünktlich','punctual / on time','—','Bitte kommen Sie pünktlich.','Work'],['verantwortlich','responsible','—','Wer ist dafür verantwortlich?','Work'],['sich vorbereiten','to prepare oneself','—','Ich bereite mich auf die Prüfung vor.','Education'],['sich interessieren','to be interested','—','Ich interessiere mich für Technik.','Education'],['sich kümmern','to take care','—','Ich kümmere mich um die Unterlagen.','Daily life'],['sich entscheiden','to decide','—','Ich entscheide mich für diesen Kurs.','Daily life']].filter(x=>x[0]!=='die Bewerbungsgespräch').map((x,i)=>({id:i,word:x[0],meaning:x[1],plural:x[2],example:x[3],category:x[4]}));
const quiz=[
{q:'Ich ___ jeden Morgen um 6 Uhr ___.',options:['stehe / auf','aufstehe / —','stehen / auf'],a:0,unit:'separable',why:'In a main clause: stehe ... auf.'},
{q:'Ich muss meine Mutter ___.',options:['rufe an','anrufen','angerufen'],a:1,unit:'separable',why:'After a modal verb, use the full infinitive.'},
{q:'Ich habe gestern mein Zimmer ___.',options:['aufgeräumt','geräumt auf','aufräumen'],a:0,unit:'separable',why:'Perfekt: haben + aufgeräumt.'},
{q:'Ich hoffe, dass ich die Prüfung ___.',options:['bestehe','ich bestehe','bestehen'],a:0,unit:'connectors',why:'In a dass clause, the conjugated verb stands at the end.'},
{q:'Wenn ich Zeit habe, ___ ich Deutsch.',options:['ich lerne','lerne','lernen'],a:1,unit:'connectors',why:'After the introductory wenn-clause, the main verb comes first.'},
{q:'Ich fahre morgen ___ Zug nach München.',options:['mit der','mit dem','mit den'],a:1,unit:'cases',why:'mit always takes dative; der Zug → dem Zug.'},
{q:'Ich ___ gestern nach Berlin gefahren.',options:['habe','bin','hatte'],a:1,unit:'perfect',why:'Movement with fahren normally uses sein in the Perfekt.'},
{q:'Ich habe meinen Freund ___.',options:['gebesucht','besuchen','besucht'],a:2,unit:'inseparable',why:'Inseparable besuchen → besucht without ge-.'},
{q:'Ich interessiere ___ für Robotik.',options:['mich','mir','ich'],a:0,unit:'reflexive',why:'sich interessieren für → ich interessiere mich für.'},
{q:'Das ist der Mann, ___ ich kenne.',options:['der','den','dem'],a:1,unit:'relative',why:'kennen takes an accusative object: den.'},
{q:'Wenn ich Urlaub hätte, ___ ich verreisen.',options:['habe','würde','war'],a:1,unit:'konjunktiv',why:'Hypothetical construction: würde + infinitive.'},
{q:'Ich habe vor, morgen früh ___.',options:['aufzustehen','zu aufstehen','aufstehen zu'],a:0,unit:'infinitive',why:'For a separable infinitive, zu comes between prefix and stem.'},
{q:'Ich suche einen ___ Arbeitsplatz.',options:['guter','guten','gutes'],a:1,unit:'adjectives',why:'Masculine accusative after einen → guten.'},
{q:'Der Brief ___ morgen geschrieben.',options:['wird','werden','wurde'],a:0,unit:'passive',why:'Present passive: wird + participle.'},
{q:'___ ich müde bin, lerne ich noch Deutsch.',options:['Deshalb','Obwohl','Trotzdem'],a:1,unit:'connectors',why:'Obwohl introduces a subordinate clause with verb-final order.'},
{q:'___ lerne ich neue Wörter.',options:['Jeden Tag','Jeden Tagen','Jede Tage'],a:0,unit:'wordorder',why:'Jeden Tag is the correct time expression.'},
];
let state={page:'home',unit:'separable',category:'All',search:'',card:0,flipped:false,answers:{},submitted:false,filter:'All',mode:'random',writing:'',prompt:0};
const prompts=[['Eine E-Mail schreiben','You cannot attend a German course tomorrow. Write an email to your teacher: explain why, apologize, and ask about homework.','Sehr geehrte Frau Müller,\nleider kann ich morgen nicht zum Deutschkurs kommen, weil ich einen wichtigen Termin habe. Es tut mir leid. Könnten Sie mir bitte die Hausaufgaben schicken?\nVielen Dank für Ihr Verständnis.\nMit freundlichen Grüßen'],['Eine Beschwerde','Your online order arrived late and the product is broken. Write a polite complaint and propose a solution.','Sehr geehrte Damen und Herren,\nich habe vor einer Woche bei Ihnen etwas bestellt. Leider kam die Lieferung zu spät an und der Artikel ist beschädigt. Deshalb bitte ich um einen Ersatz oder eine Rückerstattung.\nMit freundlichen Grüßen'],['Meinung äußern','Should people learn foreign languages? Give your opinion, two reasons, and a conclusion.','Meiner Meinung nach ist es sehr wichtig, Fremdsprachen zu lernen. Erstens kann man besser mit anderen Menschen kommunizieren. Zweitens hat man mehr Chancen im Beruf. Deshalb würde ich jedem empfehlen, eine Fremdsprache zu lernen.']];
let saved;try{saved=JSON.parse(localStorage.getItem('deutschKompass_v1'))||{}}catch{saved={}};let progress={completed:saved.completed||[],known:saved.known||[],missed:saved.missed||[],history:saved.history||[],writing:saved.writing||{}};function persist(){localStorage.setItem('deutschKompass_v1',JSON.stringify(progress))}const $=s=>document.querySelector(s),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(p){state.page=p;state.submitted=false;window.scrollTo(0,0);render()}function lesson(id){state.unit=id;nav('lesson')}function speak(t){if(!('speechSynthesis'in window)){alert('Speech playback is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}function percent(n,d){return Math.round(100*n/Math.max(1,d))}function button(label,action,style=''){return `<button class="btn ${style}" onclick="${action}">${label}</button>`}
function shell(body){let links=[['home','⌂ Dashboard'],['lessons','▤ Grammar course'],['vocab','▦ Vocabulary'],['flashcards','▣ Flashcards'],['quiz','✓ Quiz practice'],['writing','✎ Writing'],['speaking','◉ Speaking']];return `<div class="shell"><aside class="sidebar"><div class="brand">Deutsch<span>Kompass</span></div><p class="muted" style="padding:0 12px">Your A2 → B1 learning space</p><nav class="nav">${links.map(([p,n])=>`<button class="${state.page===p||(p==='lessons'&&state.page==='lesson')?'active':''}" onclick="nav('${p}')">${n}</button>`).join('')}</nav><div class="sidebottom">✓ Saves progress on this device<br>◉ German speech playback where supported<br>✦ No account needed</div></aside><main class="main">${body}<div class="footer">DeutschKompass · Self-study companion · Your progress is kept in this browser, not on a server.</div></main></div>`}
function home(){return `<div class="top"><div><div class="eyebrow">DEUTSCH LERNEN · A2–B1</div><h1>Learn German, one day at a time.</h1><div class="lead">Vocabulary, grammar, trennbare Verben, quizzes and real exam practice — explained in English.</div></div><span class="pill">B1 journey</span></div><div class="hero"><div class="eyebrow">YOUR NEXT STEP</div><h2>Start with separable verbs.</h2><p>Understand <b>aufstehen, anrufen, einkaufen</b>, the verb-second rule, and the Perfekt.</p>${button('Start lesson →',"lesson('separable')")}</div><div class="stats"><div class="stat"><small class="muted">Grammar completed</small><strong>${progress.completed.length}/${units.length}</strong><div class="progress"><div style="width:${percent(progress.completed.length,units.length)}%"></div></div></div><div class="stat"><small class="muted">Known vocabulary</small><strong>${progress.known.length}</strong><small class="muted">of ${vocab.length} words</small></div><div class="stat"><small class="muted">Needs review</small><strong>${progress.missed.length}</strong><small class="muted">flashcards</small></div><div class="stat"><small class="muted">Practice sessions</small><strong>${progress.history.length}</strong><small class="muted">quizzes completed</small></div></div><div class="section"><h2>Choose your learning activity</h2><div class="grid"><div class="card lesson-card" onclick="nav('lessons')"><span class="pill">Grammar</span><h3 style="margin-top:12px">${units.length} clear lessons</h3><p>Understand rules with examples and English translations.</p></div><div class="card lesson-card" onclick="nav('flashcards')"><span class="pill">Vocabulary</span><h3 style="margin-top:12px">${vocab.length} useful words</h3><p>Flip cards and mark each word as known or needing review.</p></div><div class="card lesson-card" onclick="nav('quiz')"><span class="pill">Practice</span><h3 style="margin-top:12px">Interactive exercises</h3><p>Get scores with explanations and corrections.</p></div></div></div><div class="section"><h2>Suggested 30-minute daily routine</h2><div class="grid"><div class="card"><b>10 min — Vocabulary</b><p>Learn 10 words with examples.</p></div><div class="card"><b>10 min — Grammar</b><p>Complete one short lesson and test yourself.</p></div><div class="card"><b>10 min — Output</b><p>Speak aloud or write a short text.</p></div></div></div>`}
function lessons(){return `<div class="eyebrow">YOUR GRAMMAR PATH</div><h1>Lessons from A2 to B1</h1><p class="lead">Study these in any order. Complete a lesson to update your dashboard.</p><div class="grid">${units.map((u,i)=>`<div class="card lesson-card" onclick="lesson('${u.id}')"><div class="row between"><span class="number">LESSON ${String(i+1).padStart(2,'0')}</span>${progress.completed.includes(u.id)?'<span class="pill">✓ Completed</span>':`<span class="tag">${u.level}</span>`}</div><h3 style="margin-top:14px">${u.title}</h3><p>${u.description}</p><div class="row between"><small class="muted">${u.topic}</small><b style="color:#65ddbd">Open →</b></div></div>`).join('')}</div>`}
function lessonPage(){let u=units.find(x=>x.id===state.unit),related=quiz.filter(q=>q.unit===u.id);return `<div class="row between"><button class="pillbtn" onclick="nav('lessons')">← All lessons</button><span class="tag">${u.level} · ${u.topic}</span></div><h1>${u.title}</h1><p class="lead">${u.description}</p><div class="card section"><h2>Understand the rule</h2><p class="lesson-body">${u.tip}</p>${u.rules.map(([name,de,en])=>`<div class="example"><div class="row between"><span class="tag">${name}</span><button class="pillbtn" onclick="speak(decodeURIComponent('${encodeURIComponent(de.replace(/<[^>]*>/g,''))}'))">🔊 Listen</button></div><div class="lesson-body" style="font-size:19px">${de}</div><small>${en}</small></div>`).join('')}</div><div class="row between"><button class="btn ${progress.completed.includes(u.id)?'secondary':''}" onclick="toggleComplete('${u.id}')">${progress.completed.includes(u.id)?'✓ Completed — undo':'Mark lesson complete ✓'}</button>${related.length?button(`Practice ${related.length} questions →`,`startQuiz('${u.id}')`,'secondary'):''}</div>`}
function toggleComplete(id){progress.completed=progress.completed.includes(id)?progress.completed.filter(x=>x!==id):[...progress.completed,id];persist();render()}
function vocabPage(){let cats=['All',...new Set(vocab.map(x=>x.category))],matches=vocab.filter(w=>(state.category==='All'||w.category===state.category)&&(w.word.toLowerCase().includes(state.search.toLowerCase())||w.meaning.toLowerCase().includes(state.search.toLowerCase())));return `<div class="eyebrow">BUILD YOUR WORD BANK</div><h1>B1 Vocabulary</h1><p class="lead">Study the article, plural, meaning and example sentence. Use the audio button for pronunciation.</p><div class="card"><div class="row"><input class="field" style="flex:2;min-width:160px" placeholder="Search German or English…" value="${escapeHTML(state.search)}" oninput="state.search=this.value;updateWords()"><select class="field" style="flex:1;min-width:150px" onchange="state.category=this.value;updateWords()">${cats.map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="wordresults">${wordResults(matches)}</div></div>`}
function wordResults(words){return `<p class="muted">Showing ${words.length} of ${vocab.length} entries</p><div style="overflow-x:auto"><table class="word-table"><thead><tr><th>German</th><th>English</th><th>Example / plural</th><th>Audio</th></tr></thead><tbody>${words.map(w=>`<tr><td><b>${escapeHTML(w.word)}</b></td><td>${escapeHTML(w.meaning)}</td><td><div>${escapeHTML(w.example)}</div><small class="muted">${escapeHTML(w.plural)}</small></td><td><button class="pillbtn" onclick="speak(decodeURIComponent('${encodeURIComponent(w.example)}'))">🔊</button></td></tr>`).join('')}</tbody></table></div>`}function updateWords(){let w=vocab.filter(x=>(state.category==='All'||x.category===state.category)&&(x.word.toLowerCase().includes(state.search.toLowerCase())||x.meaning.toLowerCase().includes(state.search.toLowerCase())));$('#wordresults').innerHTML=wordResults(w)}
function activeCards(){return state.filter==='Review'?vocab.filter(w=>progress.missed.includes(w.id)):state.filter==='New'?vocab.filter(w=>!progress.known.includes(w.id)&&!progress.missed.includes(w.id)):state.filter==='Known'?vocab.filter(w=>progress.known.includes(w.id)):vocab}
function flashcards(){let cards=activeCards();if(state.card>=cards.length)state.card=0;let w=cards[state.card];return `<div class="eyebrow">REPEAT · REMEMBER · SPEAK</div><h1>Vocabulary flashcards</h1><div class="row">${['All','New','Review','Known'].map(f=>`<button class="pillbtn ${state.filter===f?'active':''}" onclick="state.filter='${f}';state.card=0;state.flipped=false;render()">${f}</button>`).join('')}</div>${!w?`<div class="empty">No cards in this group yet. Try another filter.</div>`:`<div class="flash" onclick="state.flipped=!state.flipped;render()"><div class="eyebrow">CARD ${state.card+1} OF ${cards.length} · TAP TO FLIP</div><strong style="margin-top:30px">${escapeHTML(state.flipped?w.meaning:w.word)}</strong>${state.flipped?`<p>${escapeHTML(w.example)}</p><small class="muted">Plural: ${escapeHTML(w.plural)}</small>`:'<p>What does this mean in English?</p>'}</div><div class="row between" style="max-width:600px;margin:auto"><button class="btn secondary" onclick="changeCard(-1)">← Previous</button><button class="btn secondary" onclick="speak(decodeURIComponent('${encodeURIComponent(w.word)}'))">🔊 Hear word</button><button class="btn secondary" onclick="changeCard(1)">Next →</button></div><div class="row" style="justify-content:center;margin-top:18px">${button('Needs review ✕',`rateCard(${w.id},false)`,'ghost')}${button('I know it ✓',`rateCard(${w.id},true)`)}</div>`}<p class="muted" style="text-align:center">Marked words are stored on this device so you can revise them later.</p>`}function changeCard(delta){let l=activeCards().length;state.card=(state.card+delta+l)%Math.max(l,1);state.flipped=false;render()}function rateCard(id,known){progress.known=progress.known.filter(x=>x!==id);progress.missed=progress.missed.filter(x=>x!==id);(known?progress.known:progress.missed).push(id);persist();let l=activeCards().length;state.card=l?state.card%l:0;state.flipped=false;render()}
let quizList=quiz;function startQuiz(f='All'){state.mode=f;state.answers={};state.submitted=false;nav('quiz')}function quizPage(){quizList=state.mode==='All'?quiz:quiz.filter(q=>q.unit===state.mode);return `<div class="eyebrow">TEST YOUR KNOWLEDGE</div><h1>Grammar quiz</h1><p class="lead">Choose the correct answer. Review explanations after submitting.</p><div class="row">${button('All topics',"startQuiz('All')",state.mode==='All'?'':'secondary')}${button('Separable verbs',"startQuiz('separable')",state.mode==='separable'?'':'secondary')}${button('Connectors',"startQuiz('connectors')",state.mode==='connectors'?'':'secondary')}</div><div class="section">${quizList.map((q,i)=>`<div class="card" style="margin:12px 0"><div class="row between"><b>${i+1}. ${q.q}</b><span class="tag">${units.find(u=>u.id===q.unit)?.title||'Grammar'}</span></div><div class="options">${q.options.map((o,j)=>`<button class="option ${state.answers[i]===j?'selected':''} ${state.submitted&&j===q.a?'good':''} ${state.submitted&&state.answers[i]===j&&j!==q.a?'bad':''}" onclick="choose(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div>${state.submitted?`<p class="muted">${state.answers[i]===q.a?'✓ Correct. ':'✕ Correct answer: '+q.options[q.a]+'. '}${q.why}</p>`:''}</div>`).join('')}</div>${state.submitted?`<div class="card"><h2>Score: ${quizList.filter((q,i)=>state.answers[i]===q.a).length} / ${quizList.length}</h2>${button('Try again',`startQuiz('${state.mode}')`)}</div>`:button(`Check my answers (${Object.keys(state.answers).length}/${quizList.length})`,'submitQuiz()',Object.keys(state.answers).length!==quizList.length?'secondary':'')}`}
function choose(i,j){if(state.submitted)return;state.answers[i]=j;render()}function submitQuiz(){if(Object.keys(state.answers).length<quizList.length){alert('Answer all questions first.');return}state.submitted=true;progress.history.push({date:new Date().toISOString(),correct:quizList.filter((q,i)=>state.answers[i]===q.a).length,total:quizList.length});persist();render()}
function writing(){let p=prompts[state.prompt];let savedDraft=progress.writing[state.prompt]||'';return `<div class="eyebrow">B1 SCHREIBEN</div><h1>Writing practice</h1><p class="lead">Practice everyday emails and opinion texts for your B1 exam. Write first, then compare with a model answer.</p><div class="row">${prompts.map((x,i)=>`<button class="pillbtn ${state.prompt===i?'active':''}" onclick="state.prompt=${i};state.submitted=false;render()">Task ${i+1}</button>`).join('')}</div><div class="card section"><h2>${p[0]}</h2><p>${p[1]}</p><textarea id="writingtext" class="field writearea" placeholder="Schreiben Sie hier auf Deutsch…">${escapeHTML(savedDraft)}</textarea><div class="row between" style="margin-top:14px"><span class="muted" id="wordcount">${savedDraft.trim()?savedDraft.trim().split(/\s+/).length:0} words</span><div class="row">${button('Save draft','saveWriting()','secondary')}${button('Show model answer','showModel()')}</div></div><div id="model" class="example ${state.submitted?'':'hidden'}" style="white-space:pre-line"><b>Model answer — one possible version:</b><br>${escapeHTML(p[2])}</div></div><div class="card"><h3>Useful B1 phrases</h3><p><b>Leider kann ich … nicht …</b> — Unfortunately I cannot …<br><b>Ich möchte mich dafür entschuldigen.</b> — I would like to apologize for that.<br><b>Könnten Sie bitte …?</b> — Could you please …?<br><b>Meiner Meinung nach …</b> — In my opinion …</p></div>`}
function saveWriting(){progress.writing[state.prompt]=$('#writingtext').value;persist();$('#wordcount').textContent=(progress.writing[state.prompt].trim().split(/\s+/).filter(Boolean).length)+' words · saved ✓'}function showModel(){saveWriting();state.submitted=true;$('#model').classList.remove('hidden')}
const speakingPrompts=[['Introduce yourself','Stellen Sie sich bitte vor. Sprechen Sie über Ihre Arbeit, Hobbys und Ihre Ziele.','My name is … I live in … I work as … I am learning German because …','Mein Name ist … Ich wohne in … Ich arbeite als … Ich lerne Deutsch, weil …'],['Arrange an appointment','Vereinbaren Sie telefonisch einen Termin. Fragen Sie nach einem passenden Datum.','Hello, I would like to make an appointment. Do you have time on Tuesday?','Guten Tag, ich möchte einen Termin vereinbaren. Haben Sie am Dienstag Zeit?'],['Express an opinion','Sollten Menschen jeden Tag Sport machen? Nennen Sie Vorteile und Nachteile.','In my opinion … One advantage is … On the other hand …','Meiner Meinung nach … Ein Vorteil ist … Andererseits …'],['Plan together','Planen Sie mit einer anderen Person eine Geburtstagsfeier. Machen Sie Vorschläge.','What do you think if we …? We could …','Was hältst du davon, wenn wir …? Wir könnten …']];
function speaking(){return `<div class="eyebrow">B1 SPRECHEN</div><h1>Speaking practice</h1><p class="lead">Read a task, speak for 1–2 minutes, and compare with useful model phrases. Use the audio example to practice pronunciation.</p><div class="grid two">${speakingPrompts.map((p,i)=>`<div class="card"><span class="pill">Task ${i+1}</span><h3 style="margin-top:14px">${p[0]}</h3><div class="speak">${p[1]}</div><p>${p[2]}</p><div class="row">${button('🔊 Hear example',`speak(decodeURIComponent('${encodeURIComponent(p[3])}'))`,'secondary')}${button('Show phrases',`toggleSpeak(${i})`,'ghost')}</div><div class="example hidden" id="sp${i}">${p[3]}</div></div>`).join('')}</div><p class="muted">Tip: Browser speech playback reads examples aloud; microphone recording and pronunciation grading are not implemented in this offline version.</p>`}function toggleSpeak(i){$('#sp'+i).classList.toggle('hidden')}
function render(){let view={home,lessons,lesson:lessonPage,vocab:vocabPage,flashcards,quiz:quizPage,writing,speaking}[state.page]||home;$('#app').innerHTML=shell(view());if(state.page==='writing'){let area=$('#writingtext');area.addEventListener('input',()=>{$('#wordcount').textContent=area.value.trim().split(/\s+/).filter(Boolean).length+' words'})}}render();
</script></body></html>
